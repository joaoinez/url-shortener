[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.1",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "scalar-fastapi>=1.8.2",
    "sqlalchemy[asyncio]>=2.0.49",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.26.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
]

[tool.basedpyright]
reportUnknownVariableType = false
ignore = ["alembic/"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
